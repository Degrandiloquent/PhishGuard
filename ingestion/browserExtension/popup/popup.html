<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: white;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 12px;
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .section {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            color: #333;
        }

        .alert-item {
            padding: 12px;
            background: #fff5f5;
            border-left: 4px solid #ff6b6b;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .alert-item.high {
            background: #fef2e8;
            border-left-color: #ff8c42;
        }

        .alert-item.medium {
            background: #fefce8;
            border-left-color: #f59e0b;
        }

        .alert-item .sender {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .alert-item .reason {
            color: #666;
            font-size: 11px;
        }

        .risk-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f0f5ff;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .risk-score label {
            font-weight: 500;
            font-size: 13px;
        }

        .score-badge {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
        }

        .score-badge.high {
            background: #ff6b6b;
        }

        .score-badge.medium {
            background: #ff8c42;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 20px 10px;
            color: #999;
            font-size: 13px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #667eea;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            border-left: 3px solid #c00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth-section">
            <div class="header">
                <div class="header h1">PhishGuard</div>
                <div class="status-badge">v1.0</div>
            </div>
            <div class="section">
                <div class="section-title">Login to PhishGuard</div>
                <div id="error-message"></div>
                <form id="login-form" class="login-form">
                    <input type="email" id="email" placeholder="Email address" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
            </div>
        </div>

        <div id="dashboard-section" style="display: none;">
            <div class="header">
                <div style="flex: 1;">
                    <div style="font-size: 14px; opacity: 0.8;">Welcome</div>
                    <div style="font-weight: 600;" id="user-email"></div>
                </div>
                <button class="btn-secondary" id="logout-btn" style="flex: 0; padding: 6px 12px;">Logout</button>
            </div>

            <div class="section">
                <div class="section-title">Your Risk Profile</div>
                <div class="risk-score">
                    <label>Current Risk Score</label>
                    <div class="score-badge" id="risk-score">--</div>
                </div>
                <div style="font-size: 12px; color: #666; line-height: 1.5;">
                    <div id="risk-description">Loading...</div>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Recent Threats Detected</div>
                <div id="alerts-list">
                    <div class="empty-state">
                        <div class="spinner"></div>
                        <div style="margin-top: 10px;">Loading alerts...</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn-primary" id="refresh-btn">🔄 Refresh</button>
                <button class="btn-secondary" id="settings-btn">⚙️ Settings</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
